name: garnet

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # .env is injected into Spring Boot at runtime; it is not stored in the image.
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${APP_PORT:-8080}:8080"
