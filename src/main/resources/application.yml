spring:
    datasource:
        url: jdbc:mysql://${MYSQL_HOST:}:${MYSQL_PORT:}/${MYSQL_DATABASE:}?sslMode=${MYSQL_SSL_MODE:REQUIRED}
        username: ${MYSQL_USER:}
        password: ${MYSQL_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
                hibernate:
                    dialect: org.hibernate.dialect.MariaDBDialect
                    format_sql: true
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB
    neo4j:
        uri: ${NEO4J_URI:}
        authentication:
            username: ${NEO4J_USERNAME:}
            password: ${NEO4J_PASSWORD:}
        database: neo4j
    mail:
        host: ${MAIL_HOST:}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID:}
                        client-secret: ${GOOGLE_CLIENT_SECRET:}
                        redirect-uri: ${FRONTEND_URL:http://localhost:5173}/oauth2/callback/google
    profiles:
        active: dev
logging:
    level:
        org:
            springframework:
                data:
                    neo4j : DEBUG

aws:
    s3:
        bucket-name: ${AWS_S3_BUCKET:}
        region: ${AWS_REGION:}
    credentials:
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
jwt:
    secret: ${JWT_SECRET:}
    expiration: 1800000 # 30 min in milliseconds
    expiration-refresh: 604800000 # 7 days in milliseconds

app:
    frontend-url: ${FRONTEND_URL:http://localhost:4173}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4173}
    password-reset:
        token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:15}

recommendation:
    service:
        base-url: ${RECOMMENDATION_SERVICE_BASE_URL:http://localhost:8001}
        internal-key: ${RECOMMENDATION_INTERNAL_KEY:}
        connect-timeout-ms: ${RECOMMENDATION_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${RECOMMENDATION_READ_TIMEOUT_MS:3500}
