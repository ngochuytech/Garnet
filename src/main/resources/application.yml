spring:
    datasource:
        url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:campushub}?useSSL=false
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
                hibernate:
                    dialect: org.hibernate.dialect.MySQLDialect
                    format_sql: true
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB
    neo4j:
        uri: neo4j://127.0.0.1:7687
        authentication:
            username: ${NEO4J_USERNAME:neo4j}
            password: ${NEO4J_PASSWORD:neo4j123}
        database: neo4j

logging:
    level:
        org:
            springframework:
                data:
                    neo4j : DEBUG
jwt:
    secret: ${JWT_SECRET:CLmwUa8+3bNqOH2PqstyXqPYN6YNfsMz5D+zzWG9VYPcVKoId+XcDI/1WBc/sJZXLpWPntbLGZNqCh6LQj8zrA==}
    expiration: 1800000 # 1 hour in milliseconds
    expiration-refresh: 604800000 # 7 days in milliseconds
